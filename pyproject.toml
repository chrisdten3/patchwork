[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchwork-cli"
version = "0.1.0"
description = "Prompt-driven weight edits for Qwen3.5-0.8B with before-and-after benchmarks"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["anthropic>=0.70,<1"]

[project.optional-dependencies]
local = [
    "huggingface-hub>=1.3,<2",
    "torch>=2.6,<3",
    "transformers>=5.3,<6",
]

[project.scripts]
patchwork = "patchwork.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patchwork"]
